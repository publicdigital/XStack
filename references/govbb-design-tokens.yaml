colour:
  primitives:
    collection: "Colour"
    variable_count: 52
    scale_convention: "10, 20, 40, 60, 80, 90 – lightest to darkest. Stop 40 is the anchor (brand colour). 60 and 90 are hover/pressed intensities, populated only where a real component needs them"
    hues:
      yellow: { stops: [10, 20, 40, 60, 80, 90] }
      blue: { stops: [10, 20, 40, 60, 80, 90] }
      green: { stops: [10, 20, 40, 60, 80, 90] }
      pink: { stops: [10, 20, 40, 60, 80, 90] }
      purple: { stops: [10, 20, 40, 60, 80, 90] }
      red: { stops: [10, 20, 40, 60, 80, 90] }
      teal: { stops: [10, 20, 40, 60, 80, 90] }
      grey: { stops: [10, 20, 30, 40, 50, 60, 70, 80], note: "Full eight-stop scale, not the six-stop hue pattern" }
      neutral: { stops: ["black-00", "white-00"], note: "Absolute endpoints, outside the ramp" }
    known_values:
      # Only stops directly referenced by a token or an accessibility note.
      # Full 52-value table not yet captured here – read from Figma before relying on the rest.
      teal-40: "#30c0c8"
      teal-60: "#1a777d"
      teal-80: "#0e5f64"
      teal-90: "#0a4549"
      red-40: "#ff6b6b"
      red-60: "#bf3e3e"
      red-80: "#a42c2c"
      red-90: "#961e1f"
      yellow-20: "#ffe9a8"
      yellow-40: "#ffc726"
      yellow-80: "#e8a833"
      green-10: "#e9f9f3"
      green-20: "#a5e5ce"
      green-80: "#00654a"
      blue-10: "#e5e9f2"
      blue-40: "#00267f"
      blue-80: "#00164a"
      pink-10: "#fff4fb"
      grey-10: "#f5f6f7"
      grey-20: "#e0e4e9"
      grey-30: "#d9d9d9"
      grey-40: "#b9c0c6"
      grey-50: "#9aa2a9"
      grey-60: "#757e85"
      grey-70: "#595959"
      grey-80: "#3d3d3d"
      black-00: "#000000"
      white-00: "#ffffff"

  semantic:
    collection: "Tokens"
    mode: "Light only – dark mode parked"
    text:
      text-primary: { resolves_to: "Neutral/black-00" }
      text-secondary: { resolves_to: "Grey/grey-70" }
      text-tertiary: { resolves_to: "Grey/grey-50", note: "User-set value. Do not change without confirming – this was a deliberate edit, not drift" }
      text-inverse: { resolves_to: "Neutral/white-00" }
      text-link: { resolves_to: "Teal/teal-80" }
      text-link-hover: { resolves_to: "Teal/teal-60" }
      text-disabled: { resolves_to: "Grey/grey-30" }
      text-error: { resolves_to: "Red/red-60", note: "User-set value. Do not change without confirming – this was a deliberate edit, not drift" }
      text-success: { resolves_to: "Green/green-60", note: "User-set value. Do not change without confirming – this was a deliberate edit, not drift" }
    surface:
      surface-primary: { resolves_to: "Neutral/white-00" }
      surface-secondary: { resolves_to: "Grey/grey-10" }
      surface-error: { resolves_to: "Red/red-10" }
      surface-success: { resolves_to: "Green/green-10" }
      icon-default: { resolves_to: "Grey/grey-20", note: "New token, created for icon-on-surface fills (e.g. the Select chevron) so they are decoupled from surface-secondary" }
    border:
      border-default: { resolves_to: "Grey/grey-60", note: "User-set value. Do not change without confirming – this was a deliberate edit, not drift" }
      border-strong: { resolves_to: "Grey/grey-80", note: "User-set value. Do not change without confirming – this was a deliberate edit, not drift" }
      border-error: { resolves_to: "Red/red-80" }
      border-success: { resolves_to: "Green/green-80" }
      border-disabled: { resolves_to: "Grey/grey-20" }
    status:
      status-alpha: { resolves_to: "Blue/blue-10" }
      status-beta: { resolves_to: "Yellow/yellow-20" }
      status-migrated: { resolves_to: "Pink/pink-10" }
      status-issue: { resolves_to: "Red/red-10" }
    focus:
      focus-ring: { resolves_to: "Yellow/yellow-40", note: "Suspected error – see cross_check_findings CC-01. Code's --govbb-color-focus is teal" }
      focus-ring-ink: { resolves_to: "Neutral/black-00" }
      focus-ring-danger: { resolves_to: "Red/red-40" }
      focus-ring-danger-ink: { resolves_to: "Neutral/black-00" }
      link-focus-surface: { resolves_to: "Yellow/yellow-40" }
      link-focus-ink: { resolves_to: "Neutral/black-00" }

  component_tokens:
    button:
      count: 39
      groups: ["Primary", "Negative", "Secondary", "Tertiary", "Text", "Text-Negative", "Alternate"]
      note: "Focus state uses a drop-shadow ring baked into the component (teal-40), not bound to a variable"
    link:
      count: 12
      groups: ["Light", "Dark"]
    status_pill:
      count: 11
      groups: ["Received", "Under review", "Action needed", "Approved", "Not approved"]
      note: "Created 2026-07-27 for the Status pill component. Shared pill-fill (white) plus per-status border and text tokens, each aliasing a primitive. Action needed text aliases black-00 (yellow border would fail as text). Built as a component-token group so the pill binds tokens, not primitives directly. Completed status dropped 2026-07-27 after flow review (conflated process stage with outcome)"
    status_banner:
      count: 10
      groups: ["Received", "Under review", "Action needed", "Approved", "Not approved"]
      note: "Created 2026-07-27 for the Status banner component. Per-status surface (tint) + border (accent), each aliasing a primitive. Left accent is an individual left stroke (6px, raw). The banner nests a Status pill instance. Completed dropped 2026-07-27 after flow review"
    timeline:
      count: 5
      groups: ["marker-done", "marker-current", "connector", "marker-approved", "marker-error"]
      note: "Created 2026-07-27 for the Activity step. marker-done aliases green-80 (dark, so the white tick meets non-text contrast, unlike the mock's bright green), marker-current aliases blue-40, connector aliases grey-20. marker-approved (green-80) and marker-error (red-80) added 2026-08-05 so a terminal step's current marker carries the outcome colour (green for Approved, red for Not approved) instead of the neutral blue; both the Dot fill and the ring stroke bind to them"

