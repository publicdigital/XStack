cross_check_findings:
  source: "packages/frontend/src/tokens.css, read directly from the govbb-design-system repo"
  findings:
    - id: "CC-01"
      type: "suspected_error"
      detail: "--govbb-color-focus is teal (#30c0c8) in code. Figma's Focus/focus-ring points to Yellow/yellow-40. These should be the same general keyboard focus ring and are not. Focus/link-focus-surface (yellow) is correctly mapped separately – it is focus-ring specifically that looks wrong"
      status: "Not yet corrected. Flag before building on it"
    - id: "CC-02"
      type: "never_applied_fix"
      detail: "The on-dark Link hover colour meant to be corrected to teal-80 during the Link merge is still live in code as --govbb-teal-ink (#083a3d), now formalised as its own primitive"
      status: "Flag for correction. Not an intentional distinct colour"
    - id: "CC-03"
      type: "naming_only"
      detail: "CSS primitives are still on the old 00/10/40/100 scale. Value mapping to the new 10/20/40/60/80/90 scale is one-to-one by hex, e.g. teal-00 (code) = teal-80 (Figma)"
      status: "No action needed beyond awareness"
    - id: "CC-04"
      type: "real_conflict"
      detail: "Disabled opacity is 40% in CSS (--govbb-opacity-disabled) and 25% in the recorded Figma Button decision"
      status: "Needs a person to confirm which is correct"

published_library_notes:
  source: "Found while composing pages from the published library. Traps for anyone locating components by name"
  notes:
    - "Two published components share the name 'Status banner': the phase banner (Alpha/Beta/Migrated/Service issue) and the application status banner (Received/In progress/Approved/Rejected). A name search returns either; locate by key and confirm with a node read"
    - "'Header-test' is still published alongside the real Global / Header. Treat as a stale test publish; candidate for unpublishing"
    - "No standalone 'Ask Assistant' component is published; the assistant entry point exists only inside the Header. Do not search for one"
    - id: "CC-05"
      type: "gap"
      detail: "--govbb-color-highlight (blue-10, selected surfaces) has no Figma semantic token equivalent"
      status: "Gap, not yet scoped"

