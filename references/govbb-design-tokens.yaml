  font: "Figtree"
  roles:
    Display: { weight: "Bold", desktop: [80, 80], tablet: [64, 64], mobile: [48, 48] }
    H1: { weight: "SemiBold", desktop: [56, 64], tablet: [48, 56], mobile: [40, 48] }
    H2: { weight: "SemiBold", desktop: [40, 48], tablet: [32, 40], mobile: [28, 36] }
    H3: { weight: "SemiBold", desktop: [24, 32], tablet: [20, 32], mobile: [20, 24] }
    H4: { weight: "SemiBold", desktop: [20, 32], tablet: [18, 28], mobile: [16, 20] }
    Body-regular: { weight: "Regular", desktop: [20, 32], tablet: [20, 28], mobile: [16, 24] }
    Body-small: { weight: "Regular", desktop: [16, 24], tablet: [16, 24], mobile: [14, 20] }
    Caption: { weight: "Medium", desktop: [16, 24], tablet: [16, 24], mobile: [14, 20] }
    Lead paragraph: { weight: "Regular", desktop: [24, 32], tablet: [24, 32], mobile: [20, 28], note: "Introductory paragraph summarising a page, at the top. Use once per page. Replaces Legacy/Large body" }
  text_styles_confirmed:
    - "Display"
    - "H1"
    - "H2"
    - "H3"
    - "H4"
    - "Body-regular"
    - "Body-small"
    - "Caption"
    - "Lead paragraph"
    - "Legacy/Large body – do not use (superseded by Lead paragraph; remapped 2026-07-27, now 0 usages across Components/Patterns/Templates/Styles; retire the style pending an Alpha cross-file usage check)"
    - "Legacy/Body – do not use"
  wiring_status: "Body-regular text style applied via setTextStyleIdAsync (not a loose fontSize binding) on Button, Atom/Label, and Link. Lead paragraph text style created 2026-07-27 (24/24/20 px desktop/tablet/mobile), bound to new Typography variables, replacing Legacy/Large body. Heading/Text components not yet wired. Do not bind fontSize alone – always apply the real text style, since it bundles line-height correctly"

spacing:
  collection: "Space"
  known_values:
    xxs: 4
    xs: 8
    s: 16
    xm: 24
    m: 32
    ml: 40
    "48": 48
    l: 64
    xl: 128
  known_gaps: "Naming convention strained: xm (24), ml (40) and 48 all sit awkwardly in the t-shirt scale. ml (40) added for page gutters, 48 added for tablet margins (named numerically to avoid an ml/lm clash). Recommend migrating the crammed mid-scale stops to a numeric form (space-40, space-48). No 96 stop"
  wiring_status: "Corner radius (4px) bound to Space/xxs on Atom/Input and Button. Button padding bound to Space/xm (left/right) and Space/s (top/bottom). 8px vertical gaps bound to Space/xs on Form/Component/Input, Atom/Label, Form/Component/Date, Input/Select. Radio's circular radius (40px) intentionally left unbound – it is a fully-rounded shape convention, not a linear spacing value"

scope_guard:
  tokenised:
    - component: "Button"
      variants: 30
      note: "6 kinds x 4 states"
    - component: "Link (Link styles)"
      variants: 10
      note: "2 contexts x 5 states"
    - component: "Atom/Radio"
      variants: 7
      note: "Fill, border, and selected-fill all bound"
    - component: "Form/Radio"
      variants: 7
      note: "Composed wrapper nesting Atom/Radio. 7 = Unselected x Default/Hover/Focus/Error plus Selected x Default/Hover/Focus. Colour and spacing tokenised; selected fill reuses Button/Primary/button-primary-fill. Typography migrated to the Body-regular text style (2026-07-27)"
    - component: "Atom/Checkbox"
      variants: 7
      note: "Fill, border, and selected-fill all bound"
    - component: "Checkbox"
      variants: 7
      note: "Composed wrapper (live name Checkbox) nesting Atom/Checkbox. 7 = Unselected x Default/Hover/Focus/Error plus Selected x Default/Hover/Focus. Colour and spacing tokenised; selected fill reuses Button/Primary/button-primary-fill. Typography migrated to the Body-regular text style (2026-07-27)"
    - component: "Atom/Input"
      variants: 12
      note: "6 states x 2 types (Single line, Multi-line). No placeholder text by design – only Typing and Done states show text, top-aligned"
    - component: "Atom/Select"
      variants: 4
      note: "Rebuilt to nest a matching Atom/Input instance side-by-side with a fixed 62x62 Arrow, auto-layout, right-edge radius 0"
    - component: "Atom/Label"
      variants: 2
      note: "Label type=Default, Label type=Error. Three-tier text: Label, Description, Error message"
    - component: "Input/Select"
      variants: 4
      note: "Nests Atom/Label + Atom/Select, Error variant swaps to Label type=Error"
    - component: "Form/Component/Input"
      variants: 12
      note: "Nests Atom/Label + Atom/Input, full state cascade"
    - component: "Input/Date"
      variants: 2
      note: "Live file name is Input/Date (was Form/Component/Date). Nests 3x Form/Component/Input (day/month/year), single combined error message at the wrapper level, not one per field"
    - component: "File"
      variants: 2
      note: "Uploaded (bound to Blue/blue-10 directly, by design), Error (Surface/surface-error)"
    - component: "File upload"
      variants: 6
      note: "Live file name is File upload (was Form/Component/File upload). Default/border-default, Uploaded/border-strong, Error/border-error. Label rebuilt using Atom/Label (Upload a file / Attach a .pdf, .docx, or .png file) rather than raw text"
    - component: "Status pill"
      variants: 5
      note: "Built 2026-07-27 (node 7881:156). Status = Received/Under review/Action needed/Approved/Not approved/Completed. Bound to the Status pill/* component-token group (not primitives). Capsule radius and 1.5px stroke are raw (no token). First component of the application-tracking pattern; net-new, pending design-system adoption decision"
    - component: "Status banner"
      variants: 5
      note: "Built 2026-07-27 (node 7892:168). Left-accent card + tint per status; nests a Status pill instance, H4 heading, Body-regular body, Body-small date. Bound to Status banner/* tokens. Part of the net-new application-tracking pattern"
    - component: "Activity step"
      variants: 2
      note: "Rebuilt 2026-07-27 (node 7922:256; supersedes 7898:175, to delete). State = Done (green-80 tick) / Current (blue-40 ring + dot). Named structure: Marker rail (Marker + Connector) beside Step content (Label row + Description). Connector uses layoutAlign STRETCH + layoutGrow so it reaches the next marker. Bound to Timeline/* + text tokens"
    - component: "Contact panel"
      variants: 1
      note: "Built 2026-07-27 (node 7900:166). surface-secondary card, H4 heading, Department/Phone/Email rows, muted note. Reuses existing semantic tokens only (no new token group). Part of the application-tracking pattern"
  exists_not_tokenised:
