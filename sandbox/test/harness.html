<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DPI sandbox harness</title>
  <style>body{font-family:system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px}button{font:inherit;margin:4px 8px 4px 0}pre{background:#f4f4f6;padding:12px;white-space:pre-wrap}</style>
</head>
<body>
  <h1>DPI sandbox harness</h1>
  <p>Calls the contract in <code>references/dpi-sandbox.js</code> directly, for checking the adapter. Made-up people only.</p>
  <button id="sign-in">signIn()</button>
  <button id="sign-in-for">signIn({ actingFor: true })</button>
  <button id="fetch">data.fetch()</button>
  <button id="pay">payments.create()</button>
  <button id="reset">reset()</button>
  <pre id="out">Nothing yet.</pre>
  <script src="/references/dpi-sandbox.js"></script>
  <script>
    var dpi = xstackDpi.create({
      serviceName: 'Sandbox harness',
      locale: 'en-GB',
      platforms: { identity: { name: 'KestriaID' }, exchange: { name: 'KesLink' }, payments: { name: 'GovPay Kestria', currency: 'XTS' } },
      attributes: {
        address:   { label: 'Your district and village', source: 'National Population Register' },
        household: { label: 'Your household',            source: 'National Social Registry' },
        payoutAccount: { label: 'Where we would pay',   source: 'KesPay' }
      }
    });
    var who = null;
    function show(label, r) { window.lastResult = r; document.getElementById('out').textContent = label + '\n' + JSON.stringify(r, null, 2); }
    document.getElementById('sign-in').onclick = function () { dpi.identity.signIn({ purpose: 'test the sandbox' }).then(function (r) { who = r; show('signIn', r); }); };
    document.getElementById('sign-in-for').onclick = function () { dpi.identity.signIn({ purpose: 'test the sandbox', actingFor: true }).then(function (r) { who = r; show('signIn actingFor', r); }); };
    document.getElementById('fetch').onclick = function () { dpi.data.fetch({ subject: who && who.subject, attributes: ['address', 'household', 'payoutAccount'], purpose: 'test the sandbox' }).then(function (r) { show('data.fetch', r); }); };
    document.getElementById('pay').onclick = function () { dpi.payments.create({ amount: 250, reference: 'TEST-0001', description: 'Sandbox test fee' }).then(function (r) { show('payments.create', r); }); };
    document.getElementById('reset').onclick = function () { dpi.reset(); who = null; show('reset', {}); };
  </script>
</body>
</html>
